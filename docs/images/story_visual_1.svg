  <rect x='748' y='318' width='18' height='18' fill='#ff9ba5'/><text x='774' y='332' class='label'>夜魇魔尊</text><text x='774' y='350' class='note'>剧情冲突</text>
  <rect x='1062' y='418' width='18' height='18' fill='#71d7ff'/><text x='1088' y='432' class='label'>演武坪</text><text x='1088' y='450' class='note'>战斗教学</text>
  <rect x='1138' y='214' width='18' height='18' fill='#c9b5ff'/><text x='1164' y='228' class='label'>裂隙秘境</text><text x='1164' y='246' class='note'>中后期开启</text>
