<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='720' viewBox='0 0 1280 720' role='img' aria-label='五灵珠支线细节马赛克示意图' shape-rendering='crispEdges'>
  <defs>
    <style>
      .title { fill: #f7f3d2; font-size: 34px; font-weight: 700; }
      .subtitle { fill: #c9e6ca; font-size: 20px; }
      .label { fill: #ecf6ff; font-size: 18px; }
      .note { fill: #ffd98e; font-size: 14px; }
    </style>
    <pattern id='grass' width='16' height='16' patternUnits='userSpaceOnUse'>
      <rect width='16' height='16' fill='#3ea43f'/><rect width='4' height='4' fill='#59bb58'/><rect x='8' y='4' width='4' height='4' fill='#2f8e31'/><rect x='4' y='12' width='4' height='4' fill='#2b7a2d'/><rect x='12' y='10' width='4' height='4' fill='#4db14f'/>
    </pattern>
    <pattern id='road' width='16' height='16' patternUnits='userSpaceOnUse'>
      <rect width='16' height='16' fill='#c99e57'/><rect x='4' y='2' width='4' height='4' fill='#b88d48'/><rect x='10' y='8' width='4' height='4' fill='#ddb676'/><rect x='0' y='10' width='4' height='4' fill='#a97e3e'/>
    </pattern>
    <pattern id='water' width='16' height='16' patternUnits='userSpaceOnUse'>
      <rect width='16' height='16' fill='#4c94b8'/><rect x='2' y='2' width='4' height='4' fill='#62add2'/><rect x='8' y='10' width='4' height='4' fill='#3b7fa6'/>
    </pattern>
  </defs>

  <rect width='1280' height='720' fill='#2b3551'/><rect x='0' y='120' width='1280' height='600' fill='#3d4c69'/>
  <rect x='0' y='510' width='1280' height='210' fill='url(#road)' opacity='0.38'/>
  <rect x='40' y='28' width='760' height='80' fill='#1e2842' stroke='#9fc0ff' stroke-width='4'/>
  <text x='56' y='62' class='title'>五灵珠支线（细节马赛克）</text><text x='56' y='90' class='subtitle'>多地图分阶段收集，触发主线分歧</text>
  <rect x='80' y='430' width='260' height='220' fill='#536079' stroke='#2f3850' stroke-width='6'/><rect x='98' y='448' width='224' height='184' fill='url(#grass)' opacity='0.22'/>
  <rect x='360' y='470' width='270' height='160' fill='#6d5f71' stroke='#463d52' stroke-width='6'/><rect x='378' y='488' width='234' height='124' fill='url(#road)' opacity='0.25'/>
  <rect x='930' y='150' width='290' height='180' fill='#4a5a8a' stroke='#2f3c66' stroke-width='6'/><rect x='948' y='168' width='254' height='144' fill='url(#water)' opacity='0.2'/>
  <rect x='380' y='300' width='180' height='120' fill='#6a5a4f' stroke='#463c35' stroke-width='6'/>
  <rect x='172' y='514' width='18' height='18' fill='#c6a26b'/><text x='198' y='528' class='label'>残碑遗墟（土灵珠）</text><text x='198' y='546' class='note'>防御向奖励</text>
  <rect x='96' y='426' width='18' height='18' fill='#9fd8ff'/><text x='122' y='440' class='label'>断云崖（风灵珠）</text><text x='122' y='458' class='note'>机动性解锁</text>
  <rect x='1148' y='212' width='18' height='18' fill='#c6a7ff'/><text x='854' y='226' class='label'>裂隙秘境（雷/水/火灵珠）</text><text x='854' y='244' class='note'>高风险高收益</text>
  <rect x='420' y='356' width='18' height='18' fill='#ffd97a'/><text x='446' y='370' class='label'>碎嘴骷髅</text><text x='446' y='388' class='note'>支线情报源</text>
</svg>
<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='720' viewBox='0 0 1280 720' role='img' aria-label='五灵珠支线像素风视觉示意图' shape-rendering='crispEdges'>
  <defs>
    <style>
      .title { fill: #f8f8d8; font-size: 34px; font-weight: 700; }
      .subtitle { fill: #d6f0cf; font-size: 20px; }
      .label { fill: #f3f3f3; font-size: 18px; }
    </style>
  </defs>
  <rect width='1280' height='720' fill='#2b3551'/>
  <rect x='0' y='120' width='1280' height='600' fill='#3d4c69'/>

  <rect x='40' y='28' width='740' height='78' fill='#1e2842' stroke='#9fc0ff' stroke-width='4'/>
  <text x='58' y='62' class='title'>五灵珠支线（像素风示意）</text>
  <text x='58' y='90' class='subtitle'>遗墟/断崖/秘境收集灵珠推进后续剧情</text>

  <rect x='80' y='430' width='240' height='210' fill='#536079' stroke='#2f3850' stroke-width='6'/>
  <rect x='150' y='500' width='230' height='130' fill='#6d5f71' stroke='#463d52' stroke-width='6'/>
  <rect x='930' y='150' width='280' height='170' fill='#4a5a8a' stroke='#2f3c66' stroke-width='6'/>
  <rect x='380' y='320' width='180' height='120' fill='#6a5a4f' stroke='#463c35' stroke-width='6'/>

  <rect x='172' y='514' width='18' height='18' fill='#c6a26b'/><text x='198' y='528' class='label'>残碑遗墟（土灵珠）</text>
  <rect x='96' y='426' width='18' height='18' fill='#9fd8ff'/><text x='122' y='440' class='label'>断云崖（风灵珠）</text>
  <rect x='1148' y='212' width='18' height='18' fill='#c6a7ff'/><text x='854' y='226' class='label'>裂隙秘境（雷/水/火灵珠）</text>
  <rect x='420' y='356' width='18' height='18' fill='#ffd97a'/><text x='446' y='370' class='label'>碎嘴骷髅</text>
</svg>
